version: '3.8'

services:
  mnist-app:
    build: .
    container_name: mnist-digit-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_DEBUG=0
    volumes:
      # Mount model file (đỡ phải bake vào image)
      - ./backend/models:/app/backend/models
    restart: unless-stopped
